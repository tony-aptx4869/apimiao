<!DOCTYPE html>
<html lang="{{ LANG() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}APIMiao{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('auth.home') }}">
    <span class="brand-mark">M</span>
    <span>{{ t('site.name') }}</span>
  </a>
  <div class="top-actions">
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" type="button">{{ t('nav.language') }} <i class="bi bi-chevron-down"></i></button>
      <div class="lang-menu" id="langMenu">
        <a href="{{ url_for('auth.set_lang', lang='en') }}">English</a>
        <a href="{{ url_for('auth.set_lang', lang='zh') }}">汉语</a>
      </div>
    </div>
    {% block topactions %}{% endblock %}
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
