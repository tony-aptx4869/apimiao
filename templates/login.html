{% extends "base.html" %}
{% block title %}{{ t('login.title') }} · APIMiao{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>{{ t('login.title') }}</h1>
    {% if login_error %}<div class="alert alert-error">{{ login_error }}</div>{% endif %}
    <form method="post" class="form-stack">
      <label>{{ t('login.email') }}<input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
      <label>{{ t('login.password') }}<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit">{{ t('login.submit') }}</button>
    </form>
    <div class="divider"><span>{{ t('login.or') }}</span></div>
    <button class="btn btn-outline btn-block" id="passkeyLoginBtn" type="button">{{ t('login.passkey') }}</button>
    <p class="hint">{{ t('login.passkey.hint') }}</p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/passkey.js') }}"></script>{% endblock %}
